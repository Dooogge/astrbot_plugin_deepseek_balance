name: astrbot_plugin_deepseek_balance
display_name: deepseek余额查询
short_desc: 问一句「还剩多少饭」，她告诉你余额和还能吃几天
desc: |
  按语境识别「余额」类提问，不需要任何指令前缀：直接说「余额还有多少」「饭还够吃吗」
  就会触发，并用角色口吻播报 DeepSeek 账户余额。

  支持按余额档位切换语气（充足 / 正常 / 偏少 / 见底 / 空了），余额越少越舍不得；
  会按本地采样算出的真实消耗速率估算「还能撑几天」，样本不足时回落到配置的日均消耗。
author: Dooogge
version: 1.2.2
repo: https://github.com/Dooogge/astrbot_plugin_deepseek_balance
tags:
  - deepseek
  - 余额
  - 查询
  - 人格化
